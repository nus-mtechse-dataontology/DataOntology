[project]
name = "DataOntology"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-ai",
  "python-dotenv",
  "sqlmodel>=0.0.37",
  "asyncpg>=0.31.0",
  "psycopg2-binary>=2.9.11",
  "pytest-cov>=7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "integration: marks integration tests",
  "e2e: marks end-to-end tests",
  "external: marks tests that depend on external services",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "DataOntology.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
