[project]
name = "DataOntology"
version = "0.1.0"
requires-python = ">=3.14.3"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-dotenv",
  "ipykernel>=7.2.0",
  "pandas>=3.0.0",
  "requests>=2.32.5",
  "rdfpandas>=1.1.7",
  "google-genai>=1.62.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "DataOntology.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
