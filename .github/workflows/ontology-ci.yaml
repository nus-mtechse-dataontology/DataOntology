name: DataOntology CI/CD

on:
  push:
    branches: [ main, feat/sam-lambda-setup ]
  pull_request:
    branches: [ main, feat/sam-lambda-setup ]

jobs:
  # 1. QUALITY GATE: Scans code, not containers
  quality-and-sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for SonarQube blame data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install uv
          uv pip install --system .[dev]

      # --- UNIT TESTS ---
      - name: Run Tests
        run: uv run pytest --cov=app --cov-report=xml

      # --- SNYK (Python Library Scan) ---
      - name: Snyk Python Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # --- SONARQUBE (Python Logic Scan) ---
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=DataOntology_Orchestrator
            -Dsonar.python.version=3.14
            -Dsonar.sources=app
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # 2. DEPLOY: Build & Ship to AWS
  deploy:
    needs: quality-and-sec
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      lambda_url: ${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - uses: aws-actions/setup-sam@v2
      - run: sam build --use-container
      - name: SAM Deploy
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name data-ontology-api \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region ap-southeast-1 \
            --image-repository ${{ secrets.ECR_REPOSITORY_URI }}

      - name: Get Lambda URL
        id: get-url
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name data-ontology-api --query "Stacks[0].Outputs[?OutputKey=='DataOntologyFunctionUrl'].OutputValue" --output text)
          echo "url=$URL" >> $GITHUB_OUTPUT

  # 3. ZAP SCAN: Dynamic Attack on the URL
  zap-scan:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ needs.deploy.outputs.lambda_url }}
          cmd_options: '-a'