name: DataOntology CD (SAM + Docker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Build and Test (Runs on every Push and PR)
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies and run tests
        run: |
          python -m pip install uv
          uv pip install --system .[dev]
          uv run pytest

      - name: SAM Validate
        run: sam validate --no-insider

  # Job 2: Deploy (Only runs when code is actually on main/mvp1)
  deploy:
    needs: test-and-validate
    # This condition ensures deployment ONLY happens on a push/merge to main/mvp1
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mvp1')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build --use-container

      - name: SAM Deploy
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name data-ontology-api \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --image-repository ${{ secrets.ECR_REPOSITORY_URI }}