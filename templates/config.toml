[logger]
version = 1
disable_existing_loggers = false

[logger.handlers.data_ontology_console]
class = "logging.StreamHandler"
level = "INFO"
formatter = "data_ontology_default"
stream = "ext://sys.stdout"

[logger.handlers.default]
class = "logging.StreamHandler"
level = "INFO"
formatter = "default"
stream = "ext://sys.stderr"

[logger.handlers.access]
class = "logging.StreamHandler"
level = "INFO"
formatter = "access"
stream = "ext://sys.stdout"

[logger.handlers.error]
class = "logging.StreamHandler"
level = "ERROR"
formatter = "access"
stream = "ext://sys.stdout"

[logger.formatters.default]
"()" = "uvicorn.logging.DefaultFormatter"
fmt = "%(asctime)s - %(levelprefix)s %(message)s"
use_colors = true
datefmt = "%Y-%m-%d %H:%M:%S"

[logger.formatters.access]
"()" = "uvicorn.logging.AccessFormatter"
fmt = "%(asctime)s - %(levelprefix)s - %(client_addr)s - \"%(request_line)s\" %(status_code)s"
use_colors = true
datefmt = "%Y-%m-%d %H:%M:%S"

[logger.formatters.data_ontology_default]
format = "%(asctime)s - %(name)-15s - %(filename)-35s [%(levelname)-8s]: %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"

[logger.loggers.data_ontology]
handlers = ["data_ontology_console"]
level = "INFO"

[logger.loggers.uvicorn]
handlers = ["default"]
level = "INFO"
propagate = false

[logger.loggers.uvicorn_access]
handlers = ["access"]
level = "INFO"
propagate = false

[logger.loggers.uvicorn_error]
handlers = ["error"]
level = "ERROR"
propagate = false

[service]
title = "Data Ontology"
root_path = "/ontology"
port = @port@
host = "@host@"
credentials = true
allow_origins = ["*"]
methods = ["*"]
headers = ["*"]
docs_url = ""
redoc_url = ""
reload = false
scheme = "http"

[jwt]
expire_mins = 15
algo = "HS256"

[datasource]
[datasource.driver]
package = "@package@"
class = "@driver_class@"
options = {}

[datasource.database]
drivername = "postgresql+psycopg2"
name = "data_ontology"
host = "@db_host@"
port = @db_port@

[datasource.database.options]
user = "postgres.user"
password = "postgres.password"
echo = false